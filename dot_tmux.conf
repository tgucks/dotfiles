# --- General ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
set -g history-limit 10000

# --- Enable undercurls ---
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# --- Windows and splits ---
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane navigation ---
set -g repeat-time 5
set -s escape-time 5
bind h select-pane -L
bind C-h select-pane -L
bind j select-pane -D
bind C-j select-pane -D
bind k select-pane -U
bind C-k select-pane -U
bind l select-pane -R
bind C-l select-pane -R

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- Vi copy mode ---
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# --- TPM (Tmux Plugin Manager) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'mrjones2014/smart-splits.nvim'

# --- Claude Code notifications ---
# Sound + desktop banner + status-bar highlight are driven by
# ~/.claude/scripts/notify.sh (Stop + Notification hooks). The banner uses
# terminal-notifier (clickable -> jumps to the pane), so we no longer rely on
# tmux's bell or Claude's built-in iTerm2 escape-sequence banner. extended-keys
# is kept because it fixes Shift+Enter for newlines inside tmux.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Highlight appearance (override to match your theme) + alert sound.
set -g @claude-alert-bg "#bd93f9"
set -g @claude-alert-fg "#1e1e2e"
set -g @claude-notify-sound "/System/Library/Sounds/Glass.aiff"

# When you navigate onto a window that was flagged, clear its highlight.
set-hook -g after-select-pane   'run-shell "bash ~/.claude/scripts/claude-clear-alert.sh"'
set-hook -g after-select-window 'run-shell "bash ~/.claude/scripts/claude-clear-alert.sh"'

# prefix N: toggle Claude notifications for the current session.
bind N run-shell "bash ~/.claude/scripts/claude-toggle-notify.sh"

# --- Dracula theme ---
set -g @dracula-show-powerline true
set -g @dracula-plugins "git time"
set -g @dracula-show-left-icon session
set -g @dracula-git-colors "light_purple dark_gray"
set -g @dracula-show-empty-plugins false

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
