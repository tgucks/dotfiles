# --- General ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
set -g history-limit 10000

# --- Enable undercurls ---
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# --- Windows and splits ---
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane navigation ---
set -g repeat-time 5
set -s escape-time 5
bind h select-pane -L
bind C-h select-pane -L
bind j select-pane -D
bind C-j select-pane -D
bind k select-pane -U
bind C-k select-pane -U
bind l select-pane -R
bind C-l select-pane -R

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- Vi copy mode ---
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# --- TPM (Tmux Plugin Manager) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Dracula theme ---
set -g @dracula-show-powerline true
set -g @dracula-plugins "git time"
set -g @dracula-show-left-icon session
set -g @dracula-git-colors "light_purple dark_gray"
set -g @dracula-show-empty-plugins false

# --- Session persistence ---
set -g @resurrect-capture-pane-contents 'on'
# nvim is restored per-pane by our own post-restore hook (nvim -S <pane file>),
# so it must NOT be in resurrect's own relaunch list. We redefine the default
# process list WITHOUT nvim (vim/view stay; the manual --resume wrapper is
# unaffected). Each nvim pane saves a session keyed on its stable tmux
# coordinate, so multiple nvim panes in one cwd no longer collide on swapfiles
# (E303) - which is why per-pane restore is safe where cwd-shared restore was not.
set -g @resurrect-default-processes 'vi vim view emacs man less more tail top htop irssi weechat mutt'
# post-save: stash claude sessions. post-restore: relaunch claude --resume, then
# relaunch each nvim pane from its per-pane session file. Both hooks key on the
# stable session:window.pane identity that survives a server restart.
set -g @resurrect-hook-post-save-all 'bash ~/.local/share/tmux-dotfiles/save-claude-sessions.sh'
set -g @resurrect-hook-post-restore-all 'bash ~/.local/share/tmux-dotfiles/restore-claude-sessions.sh; bash ~/.local/share/tmux-dotfiles/restore-nvim-sessions.sh'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @continuum-boot 'on'

# Save resurrect state on every client detach so quitting iTerm / rebooting
# after `prefix d` never loses more than the last detach.
set-hook -g client-detached 'run-shell "~/.tmux/plugins/tmux-resurrect/scripts/save.sh"'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
